CONFIG_CPP=y
CONFIG_REQUIRES_FULL_LIBCPP=y
CONFIG_STD_CPP17=y
CONFIG_REBOOT=y

# Production Config
CONFIG_SIZE_OPTIMIZATIONS=y

# Networking & IPv4 DHCP
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_DNS_RESOLVER=y
CONFIG_NET_UDP=y

# Network device hostname
CONFIG_NET_HOSTNAME_ENABLE=y
CONFIG_NET_HOSTNAME_DYNAMIC=y
CONFIG_NET_HOSTNAME="aquasort_device"

# Advertise aquasort_device.local over mDNS
CONFIG_MDNS_RESPONDER=y
CONFIG_DNS_SD=y
CONFIG_MDNS_RESPONDER_DNS_SD=y

# Socket budget: the net sockets-service thread polls DNS resolver + mDNS sockets
# in one array of CONFIG_ZVFS_POLL_MAX entries (default 3 is too small once mDNS
# is on -> sockets never drained -> RX buffers exhausted -> DNS fails with -11).
CONFIG_ZVFS_POLL_MAX=10
CONFIG_NET_MAX_CONTEXTS=12
CONFIG_NET_MAX_CONN=12

# HTTP OTA endpoint
CONFIG_HTTP_PARSER=y
CONFIG_HTTP_SERVER=y
CONFIG_HTTP_SERVER_MAX_CLIENTS=2
CONFIG_HTTP_SERVER_CLIENT_BUFFER_SIZE=4096
CONFIG_HTTP_SERVER_MAX_URL_LENGTH=64
CONFIG_HTTP_SERVER_MAX_HEADER_LEN=512

# MCUboot image staging
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y
CONFIG_REBOOT=y
CONFIG_BOOTLOADER_MCUBOOT=y

# TLS (HTTPS to Supabase / Cloudflare)
CONFIG_NET_SOCKETS_SOCKOPT_TLS=y
CONFIG_MBEDTLS_SSL_PROTO_TLS1_2=y
CONFIG_MBEDTLS_SSL_SERVER_NAME_INDICATION=y
CONFIG_MBEDTLS_CIPHERSUITE_TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256=y
CONFIG_MBEDTLS_CIPHERSUITE_TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256=y
# sso.ugm.ac.id (UGM-Hotspot login) offers no GCM suites, only CBC:
# ECDHE-RSA-AES128-SHA256 / ECDHE-RSA-AES256-SHA384. Without this the handshake aborts (errno 113).
CONFIG_MBEDTLS_CIPHERSUITE_TLS_ECDHE_RSA_WITH_AES_128_CBC_SHA256=y
CONFIG_PSA_WANT_ALG_ECDSA=y
# Supabase's ECDSA chain: WE1 is signed ecdsa-with-SHA384, GTS Root R4 has a P-384 key.
# mbedTLS parses the chain even with peer verify off, so both are required.
CONFIG_PSA_WANT_ALG_SHA_384=y
CONFIG_PSA_WANT_ECC_SECP_R1_384=y
# Default 1500 B is too small: the server's certificate chain record is several KB
# and Cloudflare ignores max_fragment_length, so the handshake aborts (errno 113).
CONFIG_MBEDTLS_SSL_IN_CONTENT_LEN=16384
CONFIG_MBEDTLS_SSL_OUT_CONTENT_LEN=2048

# ESP32 Wi-Fi Driver
CONFIG_WIFI=y
CONFIG_WIFI_ESP32=y
CONFIG_NET_L2_ETHERNET=y
# Off: the driver retries the last SSID forever (even on "AP not found") and
# rejects every new connect with -EALREADY, which breaks the UGM -> basic fallback.
# beginInternet() handles retries and reconnects itself.
CONFIG_ESP32_WIFI_STA_RECONNECT=n

# Required by Espressif Wi-Fi HAL & Net Stack
CONFIG_HEAP_MEM_POOL_SIZE=55576
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
# TLS handshake runs in the main thread and needs a deep stack
CONFIG_MAIN_STACK_SIZE=8192

CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_NET_MGMT_EVENT_STACK_SIZE=4096

# Debug Config (uncomment while debugging)
# CONFIG_NO_OPTIMIZATIONS=y
# CONFIG_DEBUG_THREAD_INFO=y
# CONFIG_EXCEPTION_DEBUG=y
# CONFIG_EXCEPTION_STACK_TRACE=y
# CONFIG_STACK_SENTINEL=y
# CONFIG_LOG=y
# CONFIG_DNS_RESOLVER_LOG_LEVEL_DBG=y
# CONFIG_LOG_MODE_IMMEDIATE=y
# CONFIG_NET_LOG=y
# CONFIG_NET_SOCKETS_LOG_LEVEL_ERR=y
# CONFIG_MBEDTLS_DEBUG=y
# CONFIG_MBEDTLS_LOG_LEVEL_ERR=y
